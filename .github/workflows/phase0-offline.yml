name: job-agent phase-0 offline checks

on:
  push:
    paths:
      - "src/**"
      - "scripts/**"
      - "docker/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/phase0-offline.yml"
      - ".github/workflows/phase0-offline.yml"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "docker/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/phase0-offline.yml"
      - ".github/workflows/phase0-offline.yml"
  workflow_dispatch:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Shell syntax and Python compilation
        run: |
          bash -n scripts/run-docker.sh
          python -m compileall -q src tests
      - name: Offline tests (no model API key)
        run: |
          python -m unittest discover -s tests -v
